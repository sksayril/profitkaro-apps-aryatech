<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Code Not Found - Profit Karo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1F3A47 0%, #0F1E2E 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #FF9800;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .code {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            color: #FF9800;
            margin: 15px 0;
            display: inline-block;
        }
        a {
            color: #4A90D9;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border: 2px solid #4A90D9;
            border-radius: 25px;
            display: inline-block;
            margin-top: 20px;
        }
        a:hover {
            background: rgba(74, 144, 217, 0.2);
        }
    </style>
    <script>
        // Extract referral code from URL to display in error message
        function getReferralCode() {
            const urlParams = new URLSearchParams(window.location.search);
            let code = urlParams.get('code') || urlParams.get('refer');
            
            if (!code) {
                const pathMatch = window.location.pathname.match(/\/refer\/([A-Z0-9]+)/i);
                if (pathMatch && pathMatch[1]) {
                    code = pathMatch[1];
                }
            }
            
            return code ? code.toUpperCase() : 'UNKNOWN';
        }
        
        window.onload = function() {
            const code = getReferralCode();
            const codeElement = document.getElementById('referral-code');
            if (codeElement && code !== 'UNKNOWN') {
                codeElement.textContent = code;
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>Referral Code Not Found</h1>
        <p>The referral code <span class="code" id="referral-code">UNKNOWN</span> does not exist.</p>
        <p>Please check the link and try again, or download the app directly.</p>
        <a href="https://play.google.com/store/apps/details?id=com.profitkaro">Download ProfitKaro App</a>
    </div>
</body>
</html>
